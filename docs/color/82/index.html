<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Combinations</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  nav { padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; gap: 1.5rem; }
  nav a { color: #222; text-decoration: none; font-weight: 600; }
  nav a:hover { text-decoration: underline; }
  main { padding: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px; }
  .swatch { aspect-ratio: 1; border-radius: 8px; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  a.swatch:hover { outline: 3px solid #222; outline-offset: 2px; }
  .swatch { position: relative; }
  .swatch:hover::after { content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: #222; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 1; }
  .combo { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .combo .id { width: 3rem; font-variant-numeric: tabular-nums; color: #666; }
  .combo .swatch { width: 64px; }
  .hero { width: 160px; }
  h1 { font-size: 1.25rem; margin: .75rem 0 1.5rem; }
</style>
</head>
<body>
<nav><a href="/Color_comb/">Catalogue</a><a href="/Color_comb/combinations/">Combinations</a></nav>
<main>
<div class="swatch hero" style="background:#71502f"></div>
<h1>Pale Raw Umber</h1>
<div class="combo">
  <span class="id">#26</span>
  <a class="swatch" href="/Color_comb/color/47/" data-name="Golden Yellow" style="background:#f3a257"></a><a class="swatch" href="/Color_comb/color/82/" data-name="Pale Raw Umber" style="background:#71502f"></a>
</div>
<div class="combo">
  <span class="id">#73</span>
  <a class="swatch" href="/Color_comb/color/82/" data-name="Pale Raw Umber" style="background:#71502f"></a><a class="swatch" href="/Color_comb/color/96/" data-name="Rainette Green" style="background:#8fa071"></a>
</div>
<div class="combo">
  <span class="id">#160</span>
  <a class="swatch" href="/Color_comb/color/68/" data-name="Sulphine Yellow" style="background:#c19f2c"></a><a class="swatch" href="/Color_comb/color/82/" data-name="Pale Raw Umber" style="background:#71502f"></a><a class="swatch" href="/Color_comb/color/124/" data-name="Dark Medici Blue" style="background:#547076"></a>
</div>
<div class="combo">

<div class="combo">

  <a class="swatch" href="/Color_comb/color/38/" data-name="Sulpher Yellow" style="background:#f5ecc2"></a><a class="swatch" href="/Color_comb/color/49/" data-name="Ochraceous Salmon" style="background:#d8a37b"></a><a class="swatch" href="/Color_comb/color/82/" data-name="Pale Raw Umber" style="background:#71502f"></a><a class="swatch" href="/Color_comb/color/157/" data-name="Slate Color" style="background:#34454c"></a>
</div>

</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Combinations</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  nav { padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; gap: 1.5rem; }
  nav a { color: #222; text-decoration: none; font-weight: 600; }
  nav a:hover { text-decoration: underline; }
  main { padding: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px; }
  .swatch { aspect-ratio: 1; border-radius: 8px; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  a.swatch:hover { outline: 3px solid #222; outline-offset: 2px; }
  .swatch { position: relative; }
  .swatch:hover::after { content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: #222; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 1; }
  .combo { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .combo .id { width: 3rem; font-variant-numeric: tabular-nums; color: #666; }
  .combo .swatch { width: 64px; }
  .hero { width: 160px; }
  h1 { font-size: 1.25rem; margin: .75rem 0 1.5rem; }
</style>
</head>
<body>
<nav><a href="/Color_comb/">Catalogue</a><a href="/Color_comb/combinations/">Combinations</a></nav>
<main>
<div class="swatch hero" style="background:#f68c50"></div>
<h1>Apricot Orange</h1>
<div class="combo">
  <span class="id">#211</span>
  <a class="swatch" href="/Color_comb/color/62/" data-name="Apricot Orange" style="background:#f68c50"></a><a class="swatch" href="/Color_comb/color/93/" data-name="Olive Yellow" style="background:#a6a159"></a><a class="swatch" href="/Color_comb/color/131/" data-name="Deep Indigo" style="background:#051230"></a>
</div>
<div class="combo">
  <span class="id">#253</span>
  <a class="swatch" href="/Color_comb/color/55/" data-name="Lemon Yellow" style="background:#f8ed43"></a><a class="swatch" href="/Color_comb/color/62/" data-name="Apricot Orange" style="background:#f68c50"></a><a class="swatch" href="/Color_comb/color/151/" data-name="Cotinga Purple" style="background:#501345"></a><a class="swatch" href="/Color_comb/color/157/" data-name="Slate Color" style="background:#34454c"></a>
</div>
<div class="combo">
  <span class="id">#309</span>
  <a class="swatch" href="/Color_comb/color/47/" data-name="Golden Yellow" style="background:#f3a257"></a><a class="swatch" href="/Color_comb/color/62/" data-name="Apricot Orange" style="background:#f68c50"></a><a class="swatch" href="/Color_comb/color/127/" data-name="Violet Blue" style="background:#40456a"></a><a class="swatch" href="/Color_comb/color/128/" data-name="Vandar Poel&#x27;s Blue" style="background:#064f6e"></a>
</div>
<div class="combo">
  <span class="id">#328</span>
  <a class="swatch" href="/Color_comb/color/27/" data-name="Brick Red" style="background:#a84222"></a><a class="swatch" href="/Color_comb/color/62/" data-name="Apricot Orange" style="background:#f68c50"></a><a class="swatch" href="/Color_comb/color/86/" data-name="Vandyke Brown" style="background:#4b3317"></a><a class="swatch" href="/Color_comb/color/101/" data-name="Light Porcelain Green" style="background:#00908a"></a>
</div>

</main>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Combinations</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  nav { padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; gap: 1.5rem; }
  nav a { color: #222; text-decoration: none; font-weight: 600; }
  nav a:hover { text-decoration: underline; }
  main { padding: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px; }
  .swatch { aspect-ratio: 1; border-radius: 8px; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  a.swatch:hover { outline: 3px solid #222; outline-offset: 2px; }
  .swatch { position: relative; }
  .swatch:hover::after { content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: #222; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 1; }
  .combo { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .combo .id { width: 3rem; font-variant-numeric: tabular-nums; color: #666; }
  .combo .swatch { width: 64px; }
  .hero { width: 160px; }
  h1 { font-size: 1.25rem; margin: .75rem 0 1.5rem; }
</style>
</head>
<body>
<nav><a href="/Color_comb/">Catalogue</a><a href="/Color_comb/combinations/">Combinations</a></nav>
<main>
<div class="swatch hero" style="background:#a6a159"></div>
<h1>Olive Yellow</h1>
<div class="combo">
  <span class="id">#124</span>
  <a class="swatch" href="/Color_comb/color/35/" data-name="Pale Burnt Lake" style="background:#802626"></a><a class="swatch" href="/Color_comb/color/59/" data-name="Yellow Ocher" style="background:#e2b540"></a><a class="swatch" href="/Color_comb/color/93/" data-name="Olive Yellow" style="background:#a6a159"></a>
</div>
<div class="combo">
  <span class="id">#211</span>
  <a class="swatch" href="/Color_comb/color/62/" data-name="Apricot Orange" style="background:#f68c50"></a><a class="swatch" href="/Color_comb/color/93/" data-name="Olive Yellow" style="background:#a6a159"></a><a class="swatch" href="/Color_comb/color/131/" data-name="Deep Indigo" style="background:#051230"></a>
</div>
<div class="combo">
  <span class="id">#265</span>
  <a class="swatch" href="/Color_comb/color/10/" data-name="Old Rose" style="background:#d46d7a"></a><a class="swatch" href="/Color_comb/color/56/" data-name="Apricot Yellow" style="background:#ffdd00"></a><a class="swatch" href="/Color_comb/color/93/" data-name="Olive Yellow" style="background:#a6a159"></a><a class="swatch" href="/Color_comb/color/130/" data-name="Dull Violet Black" style="background:#1e0e3f"></a>
</div>
<div class="combo">
  <span class="id">#347</span>
  <a class="swatch" href="/Color_comb/color/93/" data-name="Olive Yellow" style="background:#a6a159"></a><a class="swatch" href="/Color_comb/color/99/" data-name="Sea Green" style="background:#00b49b"></a><a class="swatch" href="/Color_comb/color/123/" data-name="Helvetia Blue" style="background:#005b8d"></a><a class="swatch" href="/Color_comb/color/136/" data-name="Lilac" style="background:#b984af"></a>
</div>

</main>
</body>
</html>

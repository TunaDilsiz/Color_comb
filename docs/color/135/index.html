<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Color Combinations</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #fafafa; color: #222; }
  nav { padding: 1rem 2rem; background: #fff; border-bottom: 1px solid #e5e5e5; display: flex; gap: 1.5rem; }
  nav a { color: #222; text-decoration: none; font-weight: 600; }
  nav a:hover { text-decoration: underline; }
  main { padding: 2rem; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 12px; }
  .swatch { aspect-ratio: 1; border-radius: 8px; display: block; box-shadow: 0 1px 3px rgba(0,0,0,.2); }
  a.swatch:hover { outline: 3px solid #222; outline-offset: 2px; }
  .swatch { position: relative; }
  .swatch:hover::after { content: attr(data-name); position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%); background: #222; color: #fff; padding: 4px 8px; border-radius: 4px; font-size: 12px; white-space: nowrap; pointer-events: none; z-index: 1; }
  .combo { display: flex; align-items: center; gap: 12px; margin: 0 0 16px; }
  .combo .id { width: 3rem; font-variant-numeric: tabular-nums; color: #666; }
  .combo .swatch { width: 64px; }
  .hero { width: 160px; }
  h1 { font-size: 1.25rem; margin: .75rem 0 1.5rem; }
</style>
</head>
<body>
<nav><a href="/Color_comb/">Catalogue</a><a href="/Color_comb/combinations/">Combinations</a></nav>
<main>
<div class="swatch hero" style="background:#ca92a8"></div>
<h1>Laelia Pink</h1>
<div class="combo">
  <span class="id">#20</span>
  <a class="swatch" href="/Color_comb/color/115/" data-name="Calamine BLue" style="background:#78cdd0"></a><a class="swatch" href="/Color_comb/color/135/" data-name="Laelia Pink" style="background:#ca92a8"></a>
</div>
<div class="combo">
  <span class="id">#254</span>
  <a class="swatch" href="/Color_comb/color/1/" data-name="Corinthian Pink" style="background:#f8b6ba"></a><a class="swatch" href="/Color_comb/color/38/" data-name="Sulpher Yellow" style="background:#f5ecc2"></a><a class="swatch" href="/Color_comb/color/76/" data-name="Olive" style="background:#837e31"></a><a class="swatch" href="/Color_comb/color/135/" data-name="Laelia Pink" style="background:#ca92a8"></a>
</div>
<div class="combo">
  <span class="id">#280</span>
  <a class="swatch" href="/Color_comb/color/12/" data-name="Eugenia Red | B" style="background:#da525d"></a><a class="swatch" href="/Color_comb/color/107/" data-name="Lincoln Green" style="background:#555832"></a><a class="swatch" href="/Color_comb/color/135/" data-name="Laelia Pink" style="background:#ca92a8"></a><a class="swatch" href="/Color_comb/color/147/" data-name="Taupe Brown" style="background:#7a4456"></a>
</div>
<div class="combo">
  <span class="id">#337</span>
  <a class="swatch" href="/Color_comb/color/37/" data-name="Vistoris Lake" style="background:#6d4145"></a><a class="swatch" href="/Color_comb/color/135/" data-name="Laelia Pink" style="background:#ca92a8"></a><a class="swatch" href="/Color_comb/color/148/" data-name="Violet Carmine" style="background:#713b4c"></a><a class="swatch" href="/Color_comb/color/158/" data-name="Black" style="background:#111314"></a>
</div>

</main>
</body>
</html>
